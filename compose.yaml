services:
  callbox:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      CALLBOX_DEMO: "0"
      CALLBOX_ADMIN_TOKEN: "${CALLBOX_ADMIN_TOKEN:?Set a random token of at least 32 characters in your environment}"
      CALLBOX_DATA_DIR: /data
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    volumes:
      - callbox-data:/data
    restart: "no"
volumes:
  callbox-data:
