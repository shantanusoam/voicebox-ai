; Dial 1001 to reach the CallBox AI receptionist.
[general]
static = yes
writeprotect = no

[callbox]
exten => 1001,1,NoOp(CallBox AI receptionist)
 same => n,Answer()
 same => n,Set(AS_UUID=${SHELL(printf %s $(cat /proc/sys/kernel/random/uuid))})
 same => n,AudioSocket(${AS_UUID},127.0.0.1:8090)
 same => n,Hangup()

; Echo test, to prove the audio path independently of any AI.
exten => 1002,1,Answer()
 same => n,Echo()
 same => n,Hangup()
