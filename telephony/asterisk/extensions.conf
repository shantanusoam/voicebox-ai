; Multi-tenant: the DIALLED number selects which tenant answers.
[general]
static = yes
writeprotect = no

[callbox]
; A 4-digit extension stands in for a DID: 1001 -> +918000001001.
exten => _1XXX,1,NoOp(CallBox AI receptionist for ${EXTEN})
 same => n,Answer()
 same => n,Set(AS_UUID=${SHELL(printf %s $(cat /proc/sys/kernel/random/uuid))})
 ; AudioSocket carries no dialled number, so register the routing out of band
 ; before connecting. The bridge refuses a call it cannot route to a tenant.
 same => n,Set(CURL_RESULT=${CURL(http://127.0.0.1:8091/register?uuid=${AS_UUID}&called=%2B91800000${EXTEN}&caller=${CALLERID(num)})})
 same => n,AudioSocket(${AS_UUID},127.0.0.1:8090)
 same => n,Hangup()

; Echo test on 9999, outside the 1XXX DID range so it shadows no tenant.
exten => 9999,1,Answer()
 same => n,Echo()
 same => n,Hangup()
