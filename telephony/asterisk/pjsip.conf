; Local lab SIP. Loopback only, no carrier, no DID, no PSTN.
[transport-udp]
type = transport
protocol = udp
bind = 127.0.0.1:5060

; --- softphone account: 1000 / callbox-lab-secret --------------------
[1000]
type = endpoint
context = callbox
disallow = all
allow = ulaw,alaw,slin
auth = 1000
aors = 1000
direct_media = no
force_rport = yes
rewrite_contact = yes

[1000]
type = auth
auth_type = userpass
username = 1000
password = callbox-lab-secret

[1000]
type = aor
max_contacts = 2
remove_existing = yes
